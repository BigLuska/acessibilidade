<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de Teste V3 — Acessibilidade</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; line-height: 1.5; color:#222; }
    header { background:#123; color:#fff; padding:24px; }
    main { max-width:900px; margin:auto; padding:24px; }
    section { margin:28px 0; padding:20px; border:1px solid #ddd; border-radius:12px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    button, input, select, textarea { font:inherit; padding:10px; margin:5px 0; }
    button { cursor:pointer; }
    img { max-width:100%; border-radius:10px; }
    .card { border:1px solid #ddd; padding:15px; border-radius:10px; }
  </style>
</head>
<body>
<header>
  <h1>Portal de Teste V3</h1>
  <p>Use esta página para testar navegação por olhos e voz.</p>
</header>

<main>
  <section>
    <h2>Botões</h2>
    <div class="grid">
      <button id="btnComprar">Comprar agora</button>
      <button id="btnDetalhes">Ver detalhes</button>
      <button id="btnSalvar">Salvar formulário</button>
      <button id="btnAjuda">Ajuda</button>
    </div>
  </section>

  <section>
    <h2>Formulário</h2>
    <form id="formTeste">
      <label for="nome">Nome completo</label><br>
      <input id="nome" name="nome" type="text" placeholder="Digite seu nome"><br>

      <label for="email">E-mail</label><br>
      <input id="email" name="email" type="email" placeholder="seu@email.com"><br>

      <label for="idade">Idade</label><br>
      <input id="idade" name="idade" type="number" min="0" max="120"><br>

      <label for="data">Data de nascimento</label><br>
      <input id="data" name="data" type="date"><br>

      <label for="categoria">Categoria</label><br>
      <select id="categoria" name="categoria">
        <option value="">Selecione</option>
        <option>Cliente</option>
        <option>Funcionário</option>
        <option>Visitante</option>
      </select><br>

      <label for="mensagem">Mensagem</label><br>
      <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva uma mensagem"></textarea><br>

      <label><input type="checkbox" id="termos"> Aceito os termos</label><br>
      <label><input type="radio" name="contato" value="email"> E-mail</label>
      <label><input type="radio" name="contato" value="telefone"> Telefone</label>
    </form>
  </section>

  <section>
    <h2>Conteúdo visual</h2>
    <div class="grid">
      <div class="card">
        <h3>Imagem de teste</h3>
        <img src="https://picsum.photos/500/280" alt="Imagem aleatória para teste">
        <p>Este card possui texto e imagem.</p>
        <a href="https://example.com" target="_blank">Abrir link</a>
      </div>
      <div class="card">
        <h3>Informação</h3>
        <p>Este é um texto maior para testar navegação e leitura.</p>
        <progress value="70" max="100"></progress>
      </div>
    </div>
  </section>
</main>

<script src="AccessibilityMVP.js"></script>
<script>
  new AccessibilityMVP().init();
</script>
</body>
</html>
